name: docs-site
on:
  pull_request:
    paths: ["docs-site/**", "docs/**", "Architecture.md", "CLAIMS.md", ".github/workflows/docs-site.yml"]
  push:
    branches: [main]
    paths: ["docs-site/**", "docs/**", "Architecture.md", "CLAIMS.md", ".github/workflows/docs-site.yml"]
permissions:
  contents: read
defaults:
  run:
    working-directory: docs-site
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Deploys docs.euthyna.io on Cloudflare Pages from main, once the two repository secrets exist.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm run deploy
