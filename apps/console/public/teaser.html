<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EUTHYNA · 13 November</title>
<meta name="description" content="Give AI agents money. Keep the law. EUTHYNA opens on 13 November.">
<meta property="og:title" content="EUTHYNA · 13 November">
<meta property="og:description" content="Give AI agents money. Keep the law.">
<meta property="og:image" content="https://euthyna.io/media/hero-poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- Shown to the public until the reveal on 13 November 2026 (docker/Caddyfile.prod).
     Says what EUTHYNA promises, never how it works. Self-contained: no app code is loaded. -->
<style>
  :root{--night:#061433;--deep:#030918;--gold:#F2B544;--text:#C9D3EA;--mute:#8FA2CC;--marble:#F3EFE6}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--deep);color:var(--text);font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif}
  .hero{position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column}
  .hero video,.hero .poster{position:absolute;top:0;bottom:0;left:22%;width:100%;height:100%;object-fit:cover;z-index:0}
  .hero .poster{background:url(/media/hero-poster.jpg) center/cover no-repeat}
  .veil{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(3,9,24,.97) 0%,rgba(3,9,24,.9) 32%,rgba(3,9,24,.45) 56%,rgba(3,9,24,.08) 72%,rgba(3,9,24,.35) 100%),linear-gradient(180deg,rgba(3,9,24,.55) 0%,rgba(3,9,24,0) 22%,rgba(3,9,24,0) 74%,rgba(6,20,51,.98) 100%)}
  .body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;max-width:1280px;width:100%;margin:0 auto;padding:28px 48px 40px}
  .brand{display:flex;align-items:center;gap:12px;font:700 15px Cinzel,serif;letter-spacing:.26em;color:var(--marble)}
  .main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;max-width:620px;padding:60px 0}
  .kick{font:700 11px Cinzel,serif;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
  h1{margin:0;font:900 clamp(44px,5.4vw,80px)/.98 Cinzel,serif;letter-spacing:.02em;color:var(--marble);text-transform:uppercase}
  .leaf{background-image:linear-gradient(180deg,#E9A066 0%,#B4532E 55%,#7A2E14 100%),url(/media/textures/orichalcum.jpg);background-size:cover;-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:0;font-size:19px;line-height:1.6;max-width:560px}
  .count{display:flex;gap:12px;flex-wrap:wrap}
  .cell{min-width:86px;padding:14px 16px;border:1px solid rgba(242,181,68,.45);background:rgba(6,20,51,.55);text-align:center}
  .cell b{display:block;font:600 34px/1 "JetBrains Mono",monospace;color:var(--marble)}
  .cell span{display:block;margin-top:6px;font:700 10px Cinzel,serif;letter-spacing:.2em;color:var(--mute)}
  .date{font:700 13px Cinzel,serif;letter-spacing:.2em;color:var(--gold)}
  .foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font:600 11px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--mute)}
  @media (max-width:900px){
    .body{padding:22px 20px 28px}
    .hero video,.hero .poster{left:0;object-position:72% center;background-position:72% center}
    .veil{background:linear-gradient(180deg,rgba(3,9,24,.9) 0%,rgba(3,9,24,.78) 55%,rgba(3,9,24,.95) 100%)}
    p{font-size:17px}
    .count{gap:8px;flex-wrap:nowrap}
    .cell{min-width:0;flex:1;padding:12px 6px}
    .cell b{font-size:24px}
    .cell span{font-size:9px;letter-spacing:.12em}
  }
  @media (prefers-reduced-motion:reduce){.hero video{display:none}}
</style>
</head>
<body>
<section class="hero">
  <div class="poster" aria-hidden="true"></div>
  <video autoplay muted loop playsinline preload="metadata" poster="/media/hero-poster.jpg" aria-hidden="true">
    <source src="/media/hero-loop.mp4" type="video/mp4">
  </video>
  <div class="veil" aria-hidden="true"></div>
  <div class="body">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 1024 1024" aria-hidden="true">
        <circle cx="512" cy="512" r="307" fill="none" stroke="#F3EFE6" stroke-width="102"/>
        <rect x="297" y="461" width="430" height="102" fill="#C9890C"/>
        <rect x="41" y="461" width="72" height="102" fill="#C9890C"/>
        <rect x="911" y="461" width="72" height="102" fill="#C9890C"/>
      </svg>
      EUTHYNA
    </div>
    <main class="main">
      <span class="kick">Wallet infrastructure for AI agents</span>
      <h1><span class="leaf">Give AI agents money.</span><br>Keep the law.</h1>
      <p>Your agents get wallets with a budget and rules their owners vote. No one holds the keys. The doors open on 13 November.</p>
      <div class="count" id="count" role="timer" aria-label="Time left before the reveal">
        <div class="cell"><b id="d">–</b><span>DAYS</span></div>
        <div class="cell"><b id="h">–</b><span>HOURS</span></div>
        <div class="cell"><b id="m">–</b><span>MINUTES</span></div>
        <div class="cell"><b id="s">–</b><span>SECONDS</span></div>
      </div>
      <span class="date">13 NOVEMBER 2026</span>
    </main>
    <div class="foot"><span>EUTHYNA · ATLANTIS</span><span>TESTNET · NOT AUDITED</span></div>
  </div>
</section>
<script>
  // 13 November 2026, 10:00 in Paris (09:00 UTC).
  var reveal = Date.UTC(2026, 10, 13, 9, 0, 0);
  function pad(n) { return String(n).padStart(2, "0"); }
  function tick() {
    var left = Math.max(0, reveal - Date.now());
    var s = Math.floor(left / 1000);
    document.getElementById("d").textContent = String(Math.floor(s / 86400));
    document.getElementById("h").textContent = pad(Math.floor(s / 3600) % 24);
    document.getElementById("m").textContent = pad(Math.floor(s / 60) % 60);
    document.getElementById("s").textContent = pad(s % 60);
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
