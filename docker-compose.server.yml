# Server-only: public HTTPS on 80/443 with Let's Encrypt certificates persisted.
services:
  console:
    environment:
      # Until the reveal on 13 November: the key in https://euthyna.io/enter/<key> (docker/Caddyfile.prod).
      PREVIEW_KEY: ${PREVIEW_KEY:?set PREVIEW_KEY in .env, a long random string}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]

volumes:
  caddy-data:
  caddy-config:
