name: mandateos

x-app: &app
  image: mandateos-app:local
  build:
    context: .
    target: runtime
  env_file:
    - .env
  environment: &app-environment
    DATABASE_URL: postgresql://mandateos:${POSTGRES_PASSWORD:-mandateos}@postgres:5432/mandateos
    PORT: "3000"
    BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:${MANDATEOS_HTTP_PORT:-8088}}
    CONSOLE_ORIGIN: ${PUBLIC_URL:-http://localhost:${MANDATEOS_HTTP_PORT:-8088}}
    CONTRACT_ARTIFACTS_DIR: /app/contracts/res

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mandateos
      POSTGRES_USER: mandateos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mandateos}
    ports:
      - "127.0.0.1:${MANDATEOS_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandateos -d mandateos"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-init:
    <<: *app
    command: ["pnpm", "--filter", "@euthyna/db", "exec", "prisma", "db", "push"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["node", "apps/api/dist/server.js"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["node", "apps/api/dist/worker.js"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  console:
    image: mandateos-console:local
    build:
      context: .
      target: console
      args:
        VITE_API_URL: ""
        # Public on purpose: it is built into the page. Never NEAR_RPC_URL, which may carry a private key.
        VITE_NEAR_RPC_URL: ${PUBLIC_NEAR_RPC_URL:-https://rpc.testnet.fastnear.com}
        VITE_BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
        VITE_ETHEREUM_SEPOLIA_RPC_URL: ${ETHEREUM_SEPOLIA_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
        VITE_MANDATEOS_REGISTRY_ID: ${OMNIROLES_REGISTRY_ID:-euthyna-directory.testnet}
        VITE_MANDATEOS_PREVIOUS_REGISTRY_IDS: ${OMNIROLES_PREVIOUS_REGISTRY_IDS:-atlantis-registry.testnet}
        VITE_EUTHYNA_RECOVERY_ID: ${RECOVERY_CONTRACT_ID:-euthyna-recovery-v5.testnet}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MANDATEOS_HTTP_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Euthyna Market worker for one listing. Started with the stack like the rest:
  # without MARKET_DELIVERY_TOKEN it stays idle instead of crash-looping.
  # No NEAR key, no database. Read-only except /work; limited CPU, memory and processes.
  market-worker:
    build:
      context: .
      dockerfile: apps/market-worker/Dockerfile
    environment:
      EUTHYNA_API_URL: ${EUTHYNA_API_URL:-http://api:3000}
      MARKET_DELIVERY_TOKEN: ${MARKET_DELIVERY_TOKEN:-}
      MARKET_JOB: ${MARKET_JOB:-defi-due-diligence}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEFILLAMA_API_KEY: ${DEFILLAMA_API_KEY:-}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-1500}
      # Docker's default seccomp profile blocks bubblewrap: the container is the sandbox here.
      WORKER_SANDBOX: container
      # Point these at an egress proxy that only allows DeFiLlama, explorers, GitHub, search and fetch.
      HTTPS_PROXY: ${MARKET_WORKER_EGRESS_PROXY:-}
      HTTP_PROXY: ${MARKET_WORKER_EGRESS_PROXY:-}
    # No delivery token yet: idle peacefully (see docker-entrypoint.sh).
    command: ["sh", "/app/apps/market-worker/docker-entrypoint.sh"]
    read_only: true
    tmpfs:
      - /work:size=256m,mode=1777
      - /tmp:size=64m,mode=1777
      - /home/worker:size=64m,uid=10001
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped

volumes:
  postgres-data:

