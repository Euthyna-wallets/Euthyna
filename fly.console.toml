# Public front door: the console's Caddy serves the built site and proxies the API
# paths to euthyna-api.internal. Fly terminates TLS for euthyna.io and www.euthyna.io.
app = "euthyna-console"
primary_region = "cdg"

[build]
  dockerfile = "fly/console.Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
