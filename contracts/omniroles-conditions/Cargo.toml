[package]
name = "omniroles-conditions"
description = "OmniRoles permission engine: role scopes, condition trees and allowances evaluated off the EVM (NEAR vault)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
borsh.workspace = true
serde.workspace = true
sha3.workspace = true
hex.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }

[features]
# JSON / Borsh schemas for NEAR ABI generation (host builds only).
abi = ["dep:schemars", "borsh/unstable__schema"]

[dev-dependencies]
alloy-sol-types = "0.8"
alloy-primitives = "0.8"
