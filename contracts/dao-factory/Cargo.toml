[package]
name = "dao-factory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/joindefi/MandateOS"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.20.3-rust-1.86.0"
image_digest = "sha256:a84b7c401a856b6bbbe1975f235b6a8011540a24dfbde248531cccb4b2fdbadf"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh.workspace = true
near-sdk = { workspace = true, features = ["global-contracts"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["global-contracts", "unit-testing"] }
