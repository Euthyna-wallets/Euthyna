[package]
name = "vault"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/joindefi/MandateOS"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh.workspace = true
bs58.workspace = true
hex.workspace = true
near-contract-standards.workspace = true
near-sdk.workspace = true
omni-transaction.workspace = true
omniroles-conditions = { path = "../omniroles-conditions" }
schemars.workspace = true
serde.workspace = true

# ABI generation (host builds) needs JSON / Borsh schemas for condition nodes.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
omniroles-conditions = { path = "../omniroles-conditions", features = ["abi"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
serde_json.workspace = true
ed25519-dalek.workspace = true
