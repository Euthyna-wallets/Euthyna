[package]
name = "vault"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/joindefi/MandateOS"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh.workspace = true
bs58.workspace = true
curve25519-dalek = { version = "4.1.3", default-features = false }
hex.workspace = true
near-contract-standards.workspace = true
near-sdk.workspace = true
omni-transaction.workspace = true
omniroles-conditions = { path = "../omniroles-conditions" }
schemars.workspace = true
serde.workspace = true

# ABI generation (host builds) needs JSON / Borsh schemas for condition nodes.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
omniroles-conditions = { path = "../omniroles-conditions", features = ["abi"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
serde_json.workspace = true
ed25519-dalek.workspace = true
