[workspace]
members = ["vault", "governance-relay", "mock-mpc", "test-ft", "tests"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.86"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
borsh = { version = "1.8", features = ["derive"] }
bs58 = "0.5"
ed25519-dalek = "2.2"
hex = "0.4"
near-contract-standards = "=5.24.1"
near-sdk = "=5.24.1"
near-workspaces = "0.21.0"
omni-transaction = { version = "=0.3.0", default-features = false, features = ["evm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8.22"
serial_test = "3.2"
sha3 = "0.10"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync"] }
