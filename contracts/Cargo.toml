[workspace]
members = ["vault", "nomos", "omniroles-conditions", "dao-factory", "mock-mpc", "test-ft", "leash", "shares", "registry", "email-recovery", "tests"]
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99.1"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
borsh = { version = "1.8", features = ["derive"] }
bs58 = "0.5"
ed25519-dalek = "2.2"
hex = "0.4"
near-contract-standards = "=5.29.1"
near-sdk = { version = "=5.29.1", features = ["unstable"] }
near-workspaces = "=0.23.0"
omni-transaction = { version = "=0.3.0", default-features = false, features = ["evm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8.22"
serial_test = "3.2"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync"] }


# email-recovery's verifier is large: optimise it for size, or NEAR refuses a function as too
# large. Only packages no other contract uses, so their WASM does not change.
[profile.release.package.email-recovery]
opt-level = "z"
[profile.release.package.ultrahonk-no-std]
opt-level = "z"
[profile.release.package.ark-bn254-ext]
opt-level = "z"
[profile.release.package.ark-models-ext]
opt-level = "z"
