# cargo audit (contracts workspace). Checked on 5 November 2026.
#
# None of the advisories below reach a contract: `cargo tree -p <contract> --target wasm32-unknown-unknown -e normal`
# shows none of these crates in any deployed wasm. They come from the test tooling only.
#
# - rustls / rustls-webpki: near-workspaces' RPC client (sandbox tests). The patched versions conflict with the
#   aws-lc-rs that near-crypto 0.37 (near-sdk 5.29.1) locks; they move with the next near-sdk / near-workspaces.
# - crypto-bigint 0.5: p256 0.13, in the test dependency graph; the fix is the 0.7 line (a major bump of p256).
[advisories]
ignore = [
  "RUSTSEC-2026-0285", # rustls: TLS 1.3 handshake messages across encryption levels
  "RUSTSEC-2026-0346", # rustls: Debug impls expose session values
  "RUSTSEC-2026-0348", # rustls: brotli certificate decompression allocation
  "RUSTSEC-2026-0349", # rustls: ServerHello downgrade
  "RUSTSEC-2026-0382", # rustls-webpki: distrusted intermediates
  "RUSTSEC-2026-0387", # crypto-bigint 0.5: timing variability
]
