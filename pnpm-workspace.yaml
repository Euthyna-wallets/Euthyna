packages:
  - "apps/*"
  - "packages/*"

# Dependencies whose install scripts may run (pnpm 10+ blocks them by default).
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  secp256k1: true
  msgpackr-extract: false

# Patched versions of transitive dependencies flagged by audits (pnpm audit, Dependabot).
# Left as is: elliptic (no patched version exists), and decode-uri-component 0.2 under @meteorwallet/sdk's
# query-string 7: the patched 0.5 is ESM-only and breaks query-string 7, query-string 10 drops the named export the
# SDK imports, and the SDK only calls stringify (it never decodes), so the flagged decoder is not reached.
overrides:
  "undici@>=8.0.0 <8.12.2": "^8.12.3"
  "nodemailer@<10.1.4": "^10.3.1"
  "joi@>=18.0.0 <18.3.1": "^18.3.1"
  "base-x@<3.0.11": "^3.0.11"
  "nanoid@>=4.0.0 <5.1.16": "^5.1.16"
  "deepmerge-ts@<8.0.0": "^8.0.2"
  "secp256k1@5.0.0": "5.0.2"
  "@hono/node-server@>=1.19.10 <2.1.3": "^2.1.3"
