# The docs site is its own pnpm workspace: the root workspace (apps/*, packages/*) and the Docker image
# never install or build it. It is deployed to Cloudflare Pages on its own (see README.md).
packages:
  - "."

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@astrojs/runtime@0.1.2"
  - "@cloudflare/kv-asset-handler@0.5.1"
  - "@cloudflare/workers-utils@0.55.0"
  - astro@7.4.13
  - miniflare@5.20261118.0-beta
  - wrangler@4.165.0
